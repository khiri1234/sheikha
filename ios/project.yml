# Sheikha HQ – head-office iPhone app.
# Generate the Xcode project on a Mac with:  brew install xcodegen && cd ios && xcodegen
name: SheikhaHQ
options:
  bundleIdPrefix: ae.sheikhatextiles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  SheikhaHQ:
    type: application
    platform: iOS
    sources:
      - path: SheikhaHQ
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: SheikhaHQ/SheikhaHQ.entitlements
      properties:
        aps-environment: development
    info:
      path: SheikhaHQ/Info.plist
      properties:
        CFBundleDisplayName: Sheikha HQ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        NSFaceIDUsageDescription: Unlock Sheikha HQ with Face ID.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        LSApplicationQueriesSchemes:
          - whatsapp
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.sheikhatextiles.hq
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
